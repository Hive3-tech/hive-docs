[build]
  command = "npm run build"
  publish = "dist"

# Redirects (including the 404 fallback) live in public/_redirects, generated from src/content/redirects.ts.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
