[build]
  command = "npm run build"
  publish = "dist"

# 301s for old URLs live in public/_redirects (generated from src/content/redirects.ts), which also ends with the SPA
# fallback. The same fallback is declared here so both routing configs agree: prerendered files are served first,
# every other route gets /index.html and the client router renders it (including the not-found page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/agent-setup.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
